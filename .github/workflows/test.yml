name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        python -m pytest -v

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install locked dependencies
      working-directory: frontend
      run: npm ci
    - name: Typecheck
      working-directory: frontend
      run: npm run typecheck
    - name: Test browser location permission flow
      working-directory: frontend
      run: npm run test:location
    - name: Build
      working-directory: frontend
      run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Validate Compose configuration
      run: docker compose config --quiet
    - name: Build images
      run: docker compose build

    - name: Verify Compose frontend API proxy and limit
      run: |
        docker compose up -d --wait
        trap 'docker compose down -v' EXIT
        curl --fail --silent --show-error http://localhost:3000/ | grep -q '<div id="root"'
        curl --fail --silent --show-error 'http://localhost:3000/api/v1/antipode?lat=41.67&lon=26.56' |
          jq -e '.antipode_latitude == -41.67 and .antipode_longitude == -153.44'
        limited=0
        for attempt in $(seq 1 30); do
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://localhost:3000/api/v1/antipode?lat=41.67&lon=26.56')
          if [ "$code" = 429 ]; then
            limited=1
            break
          fi
        done
        test "$limited" -eq 1
