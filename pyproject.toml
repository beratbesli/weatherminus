[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherminus"
version = "2.0.0"
description = "Antipode weather, oceanography, and Earth telemetry platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
]

[project.scripts]
weatherminus = "weatherminus:main"

[tool.setuptools]
py-modules = ["weatherminus"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]

